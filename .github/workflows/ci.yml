name: CI

# Every check gates the release: GitHub Pages deploys only when the engine, isolation
# and browser jobs have all passed on the same commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Invariants, properties and regression
        run: node --test

  isolation:
    name: Each test passes on its own
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check_isolation.js

  browser:
    name: Browser smoke (source and single-file build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test tools
        run: |
          python -m pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium
      - run: python -m pytest tests/browser -q

  deploy:
    name: Deploy to GitHub Pages
    needs: [engine, isolation, browser]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@v4
